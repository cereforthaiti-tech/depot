<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FluxLiv — Gestion Factures, Stock &amp; Livraisons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
:root{
  --bg: #12161C;
  --panel: #1A2029;
  --panel-2: #202834;
  --line: #2B3441;
  --ink: #EDEFF2;
  --ink-dim: #9AA4B2;
  --ink-faint: #667080;
  --accent: #4E8FB5;
  --accent-soft: rgba(78,143,181,.15);
  --amber: #D9924F;
  --amber-soft: rgba(217,146,79,.15);
  --red: #C4553A;
  --red-soft: rgba(196,85,58,.15);
  --green: #5E9468;
  --green-soft: rgba(94,148,104,.15);
  --radius: 8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
body{font-size:14px;line-height:1.5;}
::selection{background:var(--accent-soft);}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

#root{min-height:100vh;}

.app-shell{display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{width:220px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .18s ease;}
.sidebar.collapsed{width:64px;}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--line);}
.sb-brand-mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#2E5A76);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-size:14px;color:#fff;}
.sb-brand-text{font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;}
.sb-brand-sub{font-size:11px;color:var(--ink-faint);white-space:nowrap;}
.sidebar.collapsed .sb-brand-text, .sidebar.collapsed .sb-brand-sub{display:none;}
.sb-nav{flex:1;overflow-y:auto;padding:10px 8px;}
.sb-section-label{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 6px;}
.sidebar.collapsed .sb-section-label{display:none;}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;color:var(--ink-dim);text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;white-space:nowrap;overflow:hidden;}
.sb-item svg{flex-shrink:0;width:17px;height:17px;}
.sb-item:hover{background:var(--panel-2);color:var(--ink);}
.sb-item.active{background:var(--accent-soft);color:var(--accent);}
.sidebar.collapsed .sb-item span{display:none;}
.sb-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px;}
.sidebar.collapsed .sb-badge{display:none;}
.sb-foot{padding:10px;border-top:1px solid var(--line);}
.sb-collapse-btn{width:100%;display:flex;align-items:center;justify-content:center;padding:8px;border-radius:7px;background:var(--panel-2);border:none;color:var(--ink-faint);}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 22px;background:rgba(18,22,28,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.topbar h1{font-size:16px;font-weight:700;margin:0;}
.topbar .sub{font-size:12px;color:var(--ink-faint);}
.search-box{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--ink-faint);}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:13px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.role-pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:5px 12px 5px 6px;}
.role-avatar{width:24px;height:24px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}
.role-select{background:none;border:none;color:var(--ink);font-size:12.5px;font-weight:600;outline:none;}
.role-select option{background:var(--panel-2);color:var(--ink);}

.content{padding:20px 22px 60px;max-width:1400px;width:100%;margin:0 auto;}

/* Generic */
.grid{display:grid;gap:14px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.card-title{font-size:13px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;}
.kpi-label{font-size:11.5px;color:var(--ink-faint);font-weight:600;margin-bottom:6px;}
.kpi-value{font-size:26px;font-weight:800;font-family:'IBM Plex Mono',monospace;}
.kpi-value.small{font-size:20px;}
.kpi-accent{position:absolute;left:0;top:0;bottom:0;width:3px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--ink-faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.row-hover:hover{background:var(--panel-2);}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);}
.table-wrap table{border:none;}
.table-wrap .table-wrap{border:none;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.badge-dot{width:6px;height:6px;border-radius:50%;}
.badge.b-blue{background:var(--accent-soft);color:var(--accent);}
.badge.b-amber{background:var(--amber-soft);color:var(--amber);}
.badge.b-red{background:var(--red-soft);color:var(--red);}
.badge.b-green{background:var(--green-soft);color:var(--green);}
.badge.b-gray{background:var(--panel-2);color:var(--ink-dim);}

.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:8px 14px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);}
.btn:hover{border-color:var(--ink-faint);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:#5A9CC2;}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff;}
.btn.ghost{background:none;border:none;color:var(--ink-dim);}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:12px;color:var(--ink-dim);font-weight:600;}
.field input,.field select,.field textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;color:var(--ink);outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.modal-overlay{position:fixed;inset:0;background:rgba(10,12,16,.65);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding:40px 16px;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:100%;max-width:640px;padding:22px;}
.modal-head{display:flex;align-items:center;justify-content:between;margin-bottom:14px;}
.modal-head h3{margin:0;font-size:16px;}
.modal-close{margin-left:auto;background:none;border:none;color:var(--ink-faint);font-size:18px;}

.empty-state{text-align:center;padding:40px 20px;color:var(--ink-faint);}
.empty-state svg{opacity:.4;margin-bottom:10px;}

.timeline{position:relative;padding-left:22px;}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line);}
.timeline-item{position:relative;padding-bottom:18px;}
.timeline-item::before{content:'';position:absolute;left:-22px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);}
.timeline-item.pending::before{background:var(--ink-faint);}
.timeline-item .t-title{font-weight:700;font-size:13px;}
.timeline-item .t-meta{font-size:11.5px;color:var(--ink-faint);margin-top:2px;}
.timeline-item .t-note{font-size:12.5px;color:var(--ink-dim);margin-top:4px;}

.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:7px;font-size:12.5px;margin-bottom:12px;border:1px solid;}
.alert.warn{background:var(--amber-soft);border-color:rgba(217,146,79,.35);color:#EAB877;}
.alert.error{background:var(--red-soft);border-color:rgba(196,85,58,.35);color:#E08672;}
.alert.info{background:var(--accent-soft);border-color:rgba(78,143,181,.35);color:#89C0E0;}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;}
.tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--ink-faint);border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);}

.section-title{font-size:18px;font-weight:800;margin:0 0 4px;}
.section-sub{font-size:12.5px;color:var(--ink-faint);margin:0 0 18px;}

.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

.progress-track{height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);}

.stat-line{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line);}
.stat-line:last-child{border-bottom:none;}
.stat-line .lbl{color:var(--ink-faint);}
.stat-line .val{font-weight:700;font-family:'IBM Plex Mono',monospace;}

@media (max-width: 860px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);}
  .sidebar.mobile-open{transform:translateX(0);}
  .field-row{grid-template-columns:1fr;}
  .content{padding:14px;}
  .topbar{padding:10px 14px;}
  .search-box{display:none;}
}
</style>
</head>
<body>
<div id="root">
  <div id="boot-msg" style="padding:60px 24px;text-align:center;color:#9AA4B2;font-family:system-ui,sans-serif;">
    Chargement de FluxLiv…
  </div>
</div>
<script>
  // Filet de sécurité : si React n'a pas pu se charger (connexion internet
  // instable ou CDN bloqué), on affiche un message clair au lieu d'un écran vide.
  window.addEventListener('load', function(){
    setTimeout(function(){
      if(typeof React === 'undefined' || typeof ReactDOM === 'undefined'){
        document.getElementById('root').innerHTML =
          '<div style="max-width:520px;margin:60px auto;padding:24px;font-family:system-ui,sans-serif;color:#EDEFF2;background:#1A2029;border:1px solid #2B3441;border-radius:10px;">' +
          '<h2 style="margin-top:0;">Impossible de charger l\'application</h2>' +
          '<p style="color:#9AA4B2;font-size:14px;line-height:1.6;">FluxLiv a besoin d\'internet pour charger ses composants (React) au premier lancement. ' +
          'Vérifiez votre connexion, puis rechargez la page. Si le problème persiste, essayez un autre navigateur ou réseau.</p>' +
          '</div>';
      }
    }, 4000);
  });
</script>
